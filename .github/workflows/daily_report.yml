name: 每日基金趋势分析报告

on:
  # 定时触发：每天北京时间 9:00（UTC 1:00）
  schedule:
    - cron: '0 1 * * *'
  
  # 手动触发（方便测试）
  workflow_dispatch:

jobs:
  analyze-and-send:
    name: 分析并发送报告
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: 检出仓库代码
        uses: actions/checkout@v4
      
      # 2. 设置 Python 环境
      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      # 3. 安装依赖
      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # 4. 设置中文字体（matplotlib 需要）
      - name: 安装中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei fonts-wqy-microhei
          # 更新字体缓存
          sudo fc-cache -fv
          # 彻底清除 matplotlib 字体缓存（所有可能的路径）
          rm -rf ~/.cache/matplotlib
          rm -rf ~/.matplotlib
          rm -rf /home/runner/.cache/matplotlib
          rm -rf /home/runner/.matplotlib
          # 打印已安装的中文字体（用于调试）
          echo "=== 已安装的中文字体 ==="
          fc-list :lang=zh | head -20
      
      # 5. 运行宽基指数分析（EMA版本）
      #    生成文本文件作为邮件正文
      - name: 运行宽基指数趋势分析
        id: run_ema
        continue-on-error: true
        env:
          WENCAI_QUERY: ${{ secrets.WENCAI_QUERY }}
        run: |
          echo "开始运行宽基指数趋势分析..."
          python "宽基指数趋势大模型_EMA.py" --output "宽基指数分析结果.txt"
          echo "宽基指数分析完成"
      
      # 6. 运行基金趋势分析（WMA版本）
      #    生成 Excel 文件和趋势图
      - name: 运行基金趋势分析
        id: run_wma
        continue-on-error: true
        env:
          WENCAI_QUERY: ${{ secrets.WENCAI_QUERY }}
        run: |
          echo "开始运行基金趋势分析..."
          python "基金趋势大模型_WMA.py"
          echo "基金趋势分析完成"
      
      # 7. 列出生成的文件（用于调试）
      - name: 列出生成的文件
        run: |
          echo "=== 当前目录文件 ==="
          ls -la
          echo ""
          echo "=== 基金趋势图目录 ==="
          ls -d 基金趋势图_* 2>/dev/null && ls 基金趋势图_*/ 2>/dev/null || echo "（无趋势图目录）"
      
      # 8. 上传趋势图到 Artifact（图片太大，不适合邮件附件）
      - name: 上传趋势图到 Artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: 基金趋势图_${{ github.run_id }}
          path: |
            基金趋势图_*/
          retention-days: 7
      
      # 9. 发送邮件（正文 + Excel附件 + 趋势图下载链接）
      - name: 发送分析报告邮件
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_SMTP_SERVER: ${{ secrets.MAIL_SMTP_SERVER }}
          MAIL_SMTP_PORT: ${{ secrets.MAIL_SMTP_PORT }}
        run: |
          # 构造 Artifact 下载链接
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.run_id }}"
          ARTIFACT_NAME="基金趋势图_${{ github.run_id }}"
          DOWNLOAD_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          
          echo "趋势图下载链接: $DOWNLOAD_URL"
          
          python send_email.py \
            --to "$MAIL_TO" \
            --body-file "宽基指数分析结果.txt" \
            --attach-excel "基金趋势分析.xlsx" \
            --download-url "$DOWNLOAD_URL"


