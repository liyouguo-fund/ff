name: 每日基金趋势分析报告

on:
  # 定时触发：每天北京时间 9:00（UTC 1:00）
  schedule:
    - cron: '0 1 * * *'
  
  # 手动触发（方便测试）
  workflow_dispatch:

jobs:
  analyze-and-send:
    name: 分析并发送报告
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 需要写入权限来创建 Release

    steps:
      # 1. 检出代码
      - name: 检出仓库代码
        uses: actions/checkout@v4
      
      # 2. 设置 Python 环境
      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      # 3. 安装依赖
      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # 4. 设置中文字体（matplotlib 需要）
      - name: 安装中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei fonts-wqy-microhei
          sudo fc-cache -fv
          rm -rf ~/.cache/matplotlib ~/.matplotlib /home/runner/.cache/matplotlib /home/runner/.matplotlib
          echo "=== 已安装的中文字体 ==="
          fc-list :lang=zh | head -20
      
      # 5. 运行宽基指数分析（EMA版本）
      - name: 运行宽基指数趋势分析
        id: run_ema
        continue-on-error: true
        env:
          WENCAI_QUERY: ${{ secrets.WENCAI_QUERY }}
        run: |
          echo "开始运行宽基指数趋势分析..."
          python "宽基指数趋势大模型_EMA.py" --output "宽基指数分析结果.txt"
          echo "宽基指数分析完成"
      
      # 6. 运行基金趋势分析（WMA版本）
      - name: 运行基金趋势分析
        id: run_wma
        continue-on-error: true
        env:
          WENCAI_QUERY: ${{ secrets.WENCAI_QUERY }}
        run: |
          echo "开始运行基金趋势分析..."
          python "基金趋势大模型_WMA.py"
          echo "基金趋势分析完成"
      
      # 7. 列出生成的文件
      - name: 列出生成的文件
        run: |
          echo "=== 当前目录文件 ==="
          ls -la
          echo ""
          echo "=== 基金趋势图目录 ==="
          ls -d 基金趋势图_* 2>/dev/null && ls 基金趋势图_*/ 2>/dev/null || echo "（无趋势图目录）"
      
      # 8. 打包趋势图并上传到 GitHub Release（生成公开下载链接）
      - name: 打包趋势图并创建 Release
        id: create_release
        run: |
          TODAY=$(date +'%Y%m%d')
          TAG_NAME="trend-charts-${TODAY}"
          ZIP_NAME="基金趋势图_${TODAY}.zip"
          
          # 查找趋势图目录
          IMAGES_DIR=$(ls -d 基金趋势图_* 2>/dev/null | sort -r | head -1 || echo "")
          
          if [ -n "$IMAGES_DIR" ]; then
            echo "找到趋势图目录: $IMAGES_DIR"
            
            # 打包成 zip
            zip -r "$ZIP_NAME" "$IMAGES_DIR"
            echo "已打包: $ZIP_NAME"
            
            # 删除旧的同名 tag（如果存在）
            gh release delete "$TAG_NAME" --yes 2>/dev/null || true
            git tag -d "$TAG_NAME" 2>/dev/null || true
            
            # 创建 Release 并上传 zip
            gh release create "$TAG_NAME" \
              --title "基金趋势图 ${TODAY}" \
              --notes "基金趋势分析图表 - ${TODAY}" \
              "$ZIP_NAME"
            
            # 获取公开下载 URL
            DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
            echo "DOWNLOAD_URL=${DOWNLOAD_URL}" >> $GITHUB_OUTPUT
            echo "公开下载链接: ${DOWNLOAD_URL}"
          else
            echo "未找到趋势图目录，跳过 Release"
            echo "DOWNLOAD_URL=" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      
      # 9. 发送邮件（正文 + Excel附件 + 趋势图公开下载链接）
      - name: 发送分析报告邮件
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_SMTP_SERVER: ${{ secrets.MAIL_SMTP_SERVER }}
          MAIL_SMTP_PORT: ${{ secrets.MAIL_SMTP_PORT }}
        run: |
          DOWNLOAD_URL="${{ steps.create_release.outputs.DOWNLOAD_URL }}"
          
          if [ -n "$DOWNLOAD_URL" ]; then
            echo "趋势图公开下载链接: $DOWNLOAD_URL"
            python send_email.py \
              --to "$MAIL_TO" \
              --body-file "宽基指数分析结果.txt" \
              --attach-excel "基金趋势分析.xlsx" \
              --download-url "$DOWNLOAD_URL"
          else
            echo "无趋势图下载链接，仅发送Excel附件"
            python send_email.py \
              --to "$MAIL_TO" \
              --body-file "宽基指数分析结果.txt" \
              --attach-excel "基金趋势分析.xlsx"
          fi
